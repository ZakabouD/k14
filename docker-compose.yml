services:
  caddy:
    image: caddy:2-alpine
    container_name: zk_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      TLS_CONFIG: ${TLS_CONFIG:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend_net
    depends_on:
      dashboard:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: zk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendance}
      POSTGRES_USER: ${POSTGRES_USER:-attendance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-attendance_user} -d $${POSTGRES_DB:-attendance}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: zk_migrator
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-attendance_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.docker}@postgres:5432/${POSTGRES_DB:-attendance}?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COMPANY_NAME: ${COMPANY_NAME:-Mon Entreprise}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-DH}
      TIMEZONE: ${TIMEZONE:-Africa/Casablanca}
    networks:
      - backend_net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: zk_dashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-attendance_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.docker}@postgres:5432/${POSTGRES_DB:-attendance}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env.docker}
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: zk_commercial_postgres_data
  caddy_data:
    name: zk_commercial_caddy_data
  caddy_config:
    name: zk_commercial_caddy_config

networks:
  frontend_net:
    name: zk_commercial_frontend_net
    driver: bridge
  backend_net:
    name: zk_commercial_backend_net
    driver: bridge
